name: Build PriceMY IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    defaults:
      run:
        working-directory: PriceMY-v0.1-Prototype/PriceMY/apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate iOS project if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create \
              --platforms=ios \
              --org my.pricemy \
              --project-name pricemy \
              .
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ipa/Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            build/ipa/Payload/

          cd build/ipa
          zip -r PriceMY.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PriceMY-IPA
          path: PriceMY-v0.1-Prototype/PriceMY/apps/mobile/build/ipa/PriceMY.ipa
          if-no-files-found: error
          retention-days: 30
