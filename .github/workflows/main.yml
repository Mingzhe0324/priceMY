name: Build Flutter iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5' # 你可以根据项目需要调整 Flutter 版本
          channel: 'stable'
          cache: true

      - name: Install dependencies and configure iOS
        run: |
          cd PriceMY-v0.1-Prototype/PriceMY/apps/mobile
          flutter pub get
          # 自动补全或生成 iOS 平台原生配置文件夹
          flutter create . --platforms=ios

     - name: Build iOS App (Unsigned/Profile)
        run: |
          cd PriceMY-v0.1-Prototype/PriceMY/apps/mobile
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd PriceMY-v0.1-Prototype/PriceMY/apps/mobile
          # 自动寻找编译出来的 Runner.app 路径并打包
          APP_PATH=$(find build/ios/iphoneos -name "Runner.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PriceMY.ipa Payload
          mkdir -p ../../../output
          mv PriceMY.ipa ../../../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceMY-IPA
          path: output/PriceMY.ipa
