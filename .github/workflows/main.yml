name: Build iPhone IPA (AltStore)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricemy-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build and package unsigned iPhone app
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: |
          flutter --version
          xcodebuild -version
          flutter create --platforms=ios --org my.pricemy --project-name pricemy .
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          template = Path('test/widget_test.dart')
          if template.exists() and 'Counter increments smoke test' in template.read_text():
              template.unlink()
          plist = Path('ios/Runner/Info.plist')
          data = plistlib.loads(plist.read_bytes())
          data['CFBundleDisplayName'] = 'PriceMY'
          plist.write_bytes(plistlib.dumps(data))
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build physical-device release (unsigned)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build ios --release --no-codesign --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Package IPA for AltStore signing
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/altstore/Payload
          ditto build/ios/iphoneos/Runner.app build/altstore/Payload/Runner.app
          cd build/altstore
          /usr/bin/zip -qry PriceMY-unsigned.ipa Payload
          /usr/bin/unzip -t PriceMY-unsigned.ipa
          shasum -a 256 PriceMY-unsigned.ipa > PriceMY-unsigned.ipa.sha256
      - name: Save IPA download
        uses: actions/upload-artifact@v4
        with:
          name: PriceMY-AltStore-IPA
          path: |
            apps/mobile/build/altstore/PriceMY-unsigned.ipa
            apps/mobile/build/altstore/PriceMY-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
